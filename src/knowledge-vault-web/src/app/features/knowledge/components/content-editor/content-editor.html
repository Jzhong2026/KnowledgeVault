<div class="content-editor-backdrop" (click)="requestClose()">
  <section
    class="content-editor"
    role="dialog"
    aria-modal="true"
    aria-labelledby="content-editor-title"
    (click)="$event.stopPropagation()"
  >
    <div class="content-editor__head">
      <div>
        <h2 id="content-editor-title">Edit content</h2>
        <p>Preview updates as you edit the {{ contentKind === 'markdown' ? 'Markdown' : contentKind === 'json' ? 'JSON' : 'plain text' }} source.</p>
      </div>
      <div class="content-editor__actions">
        <button type="button" class="ghost" [disabled]="saving" (click)="requestClose()">Cancel</button>
        <button type="button" class="primary" [disabled]="saving" (click)="save()">
          {{ saving ? 'Saving...' : 'Save content' }}
        </button>
        <button type="button" class="content-editor__close" [disabled]="saving" aria-label="Close editor" (click)="requestClose()">x</button>
      </div>
    </div>

    <div class="content-editor__panes" [style.--preview-width]="previewWidth() + '%'">
      <section class="content-editor__pane content-editor__pane--preview" [attr.aria-label]="previewLabel()">
        <span>Preview</span>
        @if (contentKind === 'markdown') {
          <div
            #previewEl
            class="content-editor__preview markdown-body"
            [innerHTML]="draft | markdownContent"
            [appMermaidDiagrams]="draft"
          ></div>
        } @else {
          <pre #previewEl class="content-editor__preview content-editor__preview--plain">{{ previewContent() }}</pre>
        }
      </section>
      <div
        class="content-editor__divider"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize preview and editor panes"
        (pointerdown)="onDividerPointerDown($event)"
      ></div>
      <label class="content-editor__pane content-editor__pane--source">
        <span>{{ sourceLabel() }}</span>
        <textarea
          #sourceEl
          [(ngModel)]="draft"
          (ngModelChange)="onDraftInput($event)"
          (click)="syncPreviewToCaret()"
          (keyup)="syncPreviewToCaret()"
          (scroll)="onSourceScroll()"
          [disabled]="saving"
          [attr.aria-label]="sourceLabel()"
        ></textarea>
      </label>
    </div>
  </section>
</div>
